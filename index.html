<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spore Evolution - Phase Cellulaire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a1929 0%, #020a13 100%);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Stats Panel */
        #statsPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            min-width: 250px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.5);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .stat-label {
            color: #a78bfa;
            font-weight: bold;
        }

        .stat-value {
            color: #fff;
        }

        /* Progress Bar */
        #progressBar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            border: 2px solid rgba(124, 58, 237, 0.5);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.8);
        }

        #progressText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }

        /* Minimap */
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 2px solid rgba(124, 58, 237, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Evolution Menu */
        #evolutionMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid rgba(124, 58, 237, 0.7);
            display: none;
            pointer-events: auto;
            backdrop-filter: blur(15px);
            min-width: 500px;
        }

        #evolutionMenu.active {
            display: block;
        }

        .evolution-title {
            color: #a78bfa;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .upgrades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .upgrade-card {
            background: rgba(124, 58, 237, 0.2);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(124, 58, 237, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upgrade-card:hover {
            background: rgba(124, 58, 237, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.5);
        }

        .upgrade-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-card.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .upgrade-name {
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upgrade-desc {
            color: #d1d5db;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .upgrade-cost {
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
        }

        .close-btn {
            background: rgba(239, 68, 68, 0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Game Over Screen */
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid rgba(239, 68, 68, 0.7);
            display: none;
            pointer-events: auto;
            text-align: center;
            backdrop-filter: blur(15px);
        }

        #gameOver.active {
            display: block;
        }

        .game-over-title {
            color: #ef4444;
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game-over-stats {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.7);
        }

        /* Controls Info */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            color: #a78bfa;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.5);
        }

        /* Notification */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(124, 58, 237, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: none;
            animation: fadeInOut 2s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(124, 58, 237, 0.8);
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            10%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        #startScreen.hidden {
            display: none;
        }

        .start-title {
            font-size: 48px;
            color: #a78bfa;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.8);
        }

        .start-subtitle {
            font-size: 20px;
            color: #d1d5db;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 20px 60px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.8);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="startScreen">
            <h1 class="start-title">SPORE EVOLUTION</h1>
            <p class="start-subtitle">Phase Cellulaire</p>
            <button class="start-btn" onclick="startGame()">COMMENCER</button>
        </div>

        <!-- UI Overlay -->
        <div id="ui">
            <!-- Stats Panel -->
            <div id="statsPanel">
                <div class="stat-row">
                    <span class="stat-label">Taille:</span>
                    <span class="stat-value" id="sizeValue">10</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Score:</span>
                    <span class="stat-value" id="scoreValue">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Niveau:</span>
                    <span class="stat-value" id="levelValue">1</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Vitesse:</span>
                    <span class="stat-value" id="speedValue">1.0x</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Points Evolution:</span>
                    <span class="stat-value" id="evoPoints">0</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progressBar">
                <div id="progressFill"></div>
                <div id="progressText">Croissance: 0%</div>
            </div>

            <!-- Minimap -->
            <canvas id="minimap"></canvas>

            <!-- Controls -->
            <div id="controls">
                Deplacement: Souris ou Fleches | Evolution: E | Pause: ESC
            </div>

            <!-- Evolution Menu -->
            <div id="evolutionMenu">
                <h2 class="evolution-title">EVOLUTION</h2>
                <div class="upgrades-grid" id="upgradesGrid"></div>
                <button class="close-btn" onclick="closeEvolutionMenu()">Fermer</button>
            </div>

            <!-- Game Over -->
            <div id="gameOver">
                <h1 class="game-over-title">GAME OVER</h1>
                <div class="game-over-stats" id="finalStats"></div>
                <button class="restart-btn" onclick="restartGame()">Recommencer</button>
            </div>

            <!-- Notification -->
            <div id="notification" id="notification"></div>
        </div>
    </div>

    <script>
        // Configuration du Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimap = document.getElementById('minimap');
        const minimapCtx = minimap.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        minimap.width = 150;
        minimap.height = 150;

        // Variables de jeu
        let gameStarted = false;
        let gamePaused = false;
        let gameOverState = false;

        // Monde virtuel
        const WORLD_SIZE = 3000;

        // Caméra
        const camera = {
            x: 0,
            y: 0,
            smoothFollow(target) {
                const smoothness = 0.1;
                this.x += (target.x - canvas.width / 2 - this.x) * smoothness;
                this.y += (target.y - canvas.height / 2 - this.y) * smoothness;
            }
        };

        // Classe Particule pour effets visuels
        class Particle {
            constructor(x, y, color, size, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.vx = velocity.x;
                this.vy = velocity.y;
                this.life = 1.0;
                this.decay = 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // Classe Cellule de base
        class Cell {
            constructor(x, y, size, color, type = 'neutral') {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.type = type; // 'player', 'food', 'predator', 'prey'
                this.vx = 0;
                this.vy = 0;
                this.speed = type === 'predator' ? 1.5 : type === 'prey' ? 2.5 : 1;
                this.targetX = x;
                this.targetY = y;
            }

            update() {
                if (this.type !== 'player' && this.type !== 'food') {
                    this.updateAI();
                }

                // Mouvement
                this.x += this.vx;
                this.y += this.vy;

                // Friction
                this.vx *= 0.95;
                this.vy *= 0.95;

                // Garder dans les limites du monde
                this.x = Math.max(this.size, Math.min(WORLD_SIZE - this.size, this.x));
                this.y = Math.max(this.size, Math.min(WORLD_SIZE - this.size, this.y));
            }

            updateAI() {
                if (this.type === 'food') return;

                // Chercher le joueur
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 300) {
                    if (this.type === 'predator' && player.size < this.size) {
                        // Chasser le joueur
                        const angle = Math.atan2(dy, dx);
                        this.vx += Math.cos(angle) * this.speed * 0.1;
                        this.vy += Math.sin(angle) * this.speed * 0.1;
                    } else if (this.type === 'prey' || (this.type === 'predator' && player.size > this.size)) {
                        // Fuir le joueur
                        const angle = Math.atan2(dy, dx);
                        this.vx -= Math.cos(angle) * this.speed * 0.15;
                        this.vy -= Math.sin(angle) * this.speed * 0.15;
                    }
                } else {
                    // Mouvement aléatoire
                    if (Math.random() < 0.02) {
                        this.targetX = Math.random() * WORLD_SIZE;
                        this.targetY = Math.random() * WORLD_SIZE;
                    }
                    const tdx = this.targetX - this.x;
                    const tdy = this.targetY - this.y;
                    const tdist = Math.sqrt(tdx * tdx + tdy * tdy);
                    if (tdist > 10) {
                        this.vx += (tdx / tdist) * 0.05;
                        this.vy += (tdy / tdist) * 0.05;
                    }
                }

                // Limiter la vitesse
                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.speed * 2;
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }
            }

            draw() {
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                // Ne dessiner que si visible
                if (screenX < -this.size || screenX > canvas.width + this.size ||
                    screenY < -this.size || screenY > canvas.height + this.size) {
                    return;
                }

                ctx.save();

                // Ombre
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // Gradient radial pour effet organique
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, this.size);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.7, this.color);

                let darkerColor = this.darkenColor(this.color, 0.5);
                gradient.addColorStop(1, darkerColor);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Détails organiques
                if (this.type === 'player' || this.type === 'predator') {
                    // Nucleus
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.arc(screenX - this.size * 0.2, screenY - this.size * 0.2, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Membrane pattern
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI * 2 / 6) * i + Date.now() * 0.001;
                        const px = screenX + Math.cos(angle) * this.size * 0.6;
                        const py = screenY + Math.sin(angle) * this.size * 0.6;
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.beginPath();
                        ctx.arc(px, py, this.size * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            darkenColor(color, factor) {
                if (color.startsWith('#')) {
                    const r = parseInt(color.slice(1, 3), 16);
                    const g = parseInt(color.slice(3, 5), 16);
                    const b = parseInt(color.slice(5, 7), 16);
                    return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
                }
                return color;
            }

            distanceTo(other) {
                const dx = this.x - other.x;
                const dy = this.y - other.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            collidesWith(other) {
                return this.distanceTo(other) < (this.size + other.size);
            }
        }

        // Classe Joueur
        class Player extends Cell {
            constructor(x, y) {
                super(x, y, 15, '#00d9ff', 'player');
                this.score = 0;
                this.level = 1;
                this.progress = 0;
                this.evolutionPoints = 0;
                this.baseSpeed = 2.5;
                this.speedMultiplier = 1;
                this.defense = 0;
            }

            get effectiveSpeed() {
                return this.baseSpeed * this.speedMultiplier;
            }

            moveTo(targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 5) {
                    const speed = this.effectiveSpeed;
                    this.vx += (dx / dist) * speed * 0.15;
                    this.vy += (dy / dist) * speed * 0.15;
                }

                // Limiter la vitesse
                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.effectiveSpeed * 3;
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }
            }

            eat(cell) {
                const growthAmount = cell.size * 0.3;
                this.size += growthAmount;
                this.score += Math.floor(cell.size * 10);
                this.progress += cell.size;

                // Effets de particules
                createEatParticles(cell.x, cell.y, cell.color);

                // Vérifier évolution
                const requiredProgress = this.level * 100;
                if (this.progress >= requiredProgress) {
                    this.levelUp();
                }

                updateUI();
            }

            levelUp() {
                this.level++;
                this.progress = 0;
                this.evolutionPoints++;

                showNotification(`NIVEAU ${this.level}!`);

                // Ouvrir le menu d'évolution
                setTimeout(() => {
                    openEvolutionMenu();
                }, 500);

                updateUI();
            }

            takeDamage() {
                if (this.defense > 0) {
                    this.defense--;
                    showNotification('BOUCLIER ACTIVE!');
                    return false;
                }
                return true;
            }
        }

        // Variables de jeu
        let player;
        let cells = [];
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        let keys = {};

        // Système d'améliorations
        const upgrades = {
            speed: {
                name: 'Vitesse Améliorée',
                desc: 'Augmente la vitesse de déplacement',
                cost: 1,
                level: 0,
                maxLevel: 5,
                apply: () => { player.speedMultiplier += 0.3; }
            },
            size: {
                name: 'Croissance Rapide',
                desc: 'Augmente la taille de base',
                cost: 1,
                level: 0,
                maxLevel: 3,
                apply: () => { player.size += 5; }
            },
            defense: {
                name: 'Membrane Renforcée',
                desc: 'Protège contre un prédateur',
                cost: 2,
                level: 0,
                maxLevel: 3,
                apply: () => { player.defense++; }
            },
            efficiency: {
                name: 'Métabolisme Efficace',
                desc: 'Gain de croissance x1.5',
                cost: 2,
                level: 0,
                maxLevel: 3,
                apply: () => { /* Appliqué dans la méthode eat */ }
            }
        };

        // Initialisation
        function init() {
            player = new Player(WORLD_SIZE / 2, WORLD_SIZE / 2);
            cells = [];
            particles = [];

            // Créer nourriture
            for (let i = 0; i < 150; i++) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    3 + Math.random() * 5,
                    getRandomFoodColor(),
                    'food'
                ));
            }

            // Créer proies
            for (let i = 0; i < 30; i++) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    8 + Math.random() * 10,
                    '#4ade80',
                    'prey'
                ));
            }

            // Créer prédateurs
            for (let i = 0; i < 15; i++) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    20 + Math.random() * 20,
                    '#ef4444',
                    'predator'
                ));
            }

            updateUI();
        }

        function getRandomFoodColor() {
            const colors = ['#fbbf24', '#f97316', '#a855f7', '#ec4899', '#22d3ee'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Créer des particules lors de la consommation
        function createEatParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                particles.push(new Particle(
                    x, y, color, 2 + Math.random() * 3,
                    { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed }
                ));
            }
        }

        // Gestion de la nourriture
        function spawnFood() {
            if (cells.filter(c => c.type === 'food').length < 100) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    3 + Math.random() * 5,
                    getRandomFoodColor(),
                    'food'
                ));
            }
        }

        // Boucle de jeu
        function gameLoop() {
            if (!gameStarted || gamePaused || gameOverState) return;

            // Clear
            ctx.fillStyle = 'rgba(2, 10, 19, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background pattern
            drawBackground();

            // Update camera
            camera.smoothFollow(player);

            // Update player
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.moveTo(player.x, player.y - 100);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.moveTo(player.x, player.y + 100);
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.moveTo(player.x - 100, player.y);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.moveTo(player.x + 100, player.y);
            }

            player.update();

            // Update cells
            cells.forEach(cell => cell.update());

            // Vérifier collisions
            cells = cells.filter(cell => {
                if (player.collidesWith(cell)) {
                    if (cell.type === 'food' || (cell.size < player.size * 0.8)) {
                        player.eat(cell);
                        return false;
                    } else if (cell.size > player.size * 1.2 && cell.type === 'predator') {
                        if (player.takeDamage()) {
                            gameOver();
                        }
                    }
                }
                return true;
            });

            // Spawn nourriture périodiquement
            if (Math.random() < 0.02) {
                spawnFood();
            }

            // Spawn nouvelles créatures
            if (Math.random() < 0.005 && cells.filter(c => c.type === 'prey').length < 40) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    8 + Math.random() * 10,
                    '#4ade80',
                    'prey'
                ));
            }

            if (Math.random() < 0.002 && cells.filter(c => c.type === 'predator').length < 20) {
                cells.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    player.size * 1.5 + Math.random() * 20,
                    '#ef4444',
                    'predator'
                ));
            }

            // Draw cells
            cells.forEach(cell => cell.draw());

            // Draw player
            player.draw();

            // Update and draw particles
            particles = particles.filter(p => {
                p.update();
                p.draw();
                return !p.isDead();
            });

            // Draw cursor indicator
            drawCursor();

            // Update minimap
            updateMinimap();

            requestAnimationFrame(gameLoop);
        }

        // Dessiner le fond avec motif
        function drawBackground() {
            const gridSize = 50;
            const offsetX = camera.x % gridSize;
            const offsetY = camera.y % gridSize;

            ctx.strokeStyle = 'rgba(124, 58, 237, 0.05)';
            ctx.lineWidth = 1;

            for (let x = -offsetX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = -offsetY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Dessiner curseur personnalisé
        function drawCursor() {
            const screenX = mouseX;
            const screenY = mouseY;

            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(screenX - 15, screenY);
            ctx.lineTo(screenX + 15, screenY);
            ctx.moveTo(screenX, screenY - 15);
            ctx.lineTo(screenX, screenY + 15);
            ctx.stroke();
        }

        // Mettre à jour la minimap
        function updateMinimap() {
            const scale = minimap.width / WORLD_SIZE;

            minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            minimapCtx.fillRect(0, 0, minimap.width, minimap.height);

            // Bordure du monde
            minimapCtx.strokeStyle = 'rgba(124, 58, 237, 0.5)';
            minimapCtx.lineWidth = 2;
            minimapCtx.strokeRect(1, 1, minimap.width - 2, minimap.height - 2);

            // Dessiner cellules
            cells.forEach(cell => {
                minimapCtx.fillStyle = cell.type === 'predator' ? '#ef4444' :
                                      cell.type === 'prey' ? '#4ade80' : '#888';
                minimapCtx.fillRect(
                    cell.x * scale - 1,
                    cell.y * scale - 1,
                    2, 2
                );
            });

            // Dessiner joueur
            minimapCtx.fillStyle = '#00d9ff';
            minimapCtx.fillRect(
                player.x * scale - 2,
                player.y * scale - 2,
                4, 4
            );
        }

        // UI Updates
        function updateUI() {
            document.getElementById('sizeValue').textContent = Math.floor(player.size);
            document.getElementById('scoreValue').textContent = player.score;
            document.getElementById('levelValue').textContent = player.level;
            document.getElementById('speedValue').textContent = player.speedMultiplier.toFixed(1) + 'x';
            document.getElementById('evoPoints').textContent = player.evolutionPoints;

            const requiredProgress = player.level * 100;
            const progressPercent = Math.min((player.progress / requiredProgress) * 100, 100);
            document.getElementById('progressFill').style.width = progressPercent + '%';
            document.getElementById('progressText').textContent = `Croissance: ${Math.floor(progressPercent)}%`;
        }

        // Menu évolution
        function openEvolutionMenu() {
            gamePaused = true;
            const menu = document.getElementById('evolutionMenu');
            menu.classList.add('active');

            const grid = document.getElementById('upgradesGrid');
            grid.innerHTML = '';

            Object.keys(upgrades).forEach(key => {
                const upgrade = upgrades[key];
                const canAfford = player.evolutionPoints >= upgrade.cost;
                const maxed = upgrade.level >= upgrade.maxLevel;

                const card = document.createElement('div');
                card.className = 'upgrade-card' + (!canAfford || maxed ? ' disabled' : '');
                card.innerHTML = `
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                    <div class="upgrade-cost">${maxed ? 'MAX' : `Coût: ${upgrade.cost} points`}</div>
                    <div class="upgrade-desc">Niveau: ${upgrade.level}/${upgrade.maxLevel}</div>
                `;

                if (canAfford && !maxed) {
                    card.onclick = () => purchaseUpgrade(key);
                }

                grid.appendChild(card);
            });
        }

        function closeEvolutionMenu() {
            gamePaused = false;
            document.getElementById('evolutionMenu').classList.remove('active');
        }

        function purchaseUpgrade(key) {
            const upgrade = upgrades[key];
            if (player.evolutionPoints >= upgrade.cost && upgrade.level < upgrade.maxLevel) {
                player.evolutionPoints -= upgrade.cost;
                upgrade.level++;
                upgrade.apply();
                updateUI();
                openEvolutionMenu(); // Refresh menu
                showNotification(`${upgrade.name} amélioré!`);
            }
        }

        // Notifications
        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 2000);
        }

        // Game Over
        function gameOver() {
            gameOverState = true;
            const screen = document.getElementById('gameOver');
            screen.classList.add('active');
            document.getElementById('finalStats').innerHTML = `
                Score Final: ${player.score}<br>
                Taille Finale: ${Math.floor(player.size)}<br>
                Niveau Atteint: ${player.level}
            `;
        }

        function restartGame() {
            gameOverState = false;
            document.getElementById('gameOver').classList.remove('active');
            init();
            gameLoop();
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameStarted = true;
            init();
            gameLoop();
        }

        // Event Listeners
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (gameStarted && !gamePaused && !gameOverState) {
                player.moveTo(mouseX + camera.x, mouseY + camera.y);
            }
        });

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === 'e' || e.key === 'E') {
                if (!gamePaused && player.evolutionPoints > 0) {
                    openEvolutionMenu();
                }
            }

            if (e.key === 'Escape') {
                if (document.getElementById('evolutionMenu').classList.contains('active')) {
                    closeEvolutionMenu();
                } else {
                    gamePaused = !gamePaused;
                    if (!gamePaused) gameLoop();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Démarrage automatique de l'animation de fond
        (function backgroundAnimation() {
            if (!gameStarted) {
                ctx.fillStyle = 'rgba(2, 10, 19, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Particules d'ambiance
                for (let i = 0; i < 3; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const size = Math.random() * 3;
                    ctx.fillStyle = `rgba(124, 58, 237, ${Math.random() * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            if (!gameStarted) {
                requestAnimationFrame(backgroundAnimation);
            }
        })();
    </script>
</body>
</html>
