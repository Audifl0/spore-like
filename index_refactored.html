<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spore Evolution - Version Refactorisée</title>
    <style>
        /* ============================================
           GLOBAL STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #6d28d9;
            --success-color: #4ade80;
            --danger-color: #ef4444;
            --warning-color: #facc15;
            --info-color: #00d9ff;
            --bg-dark: #0a1929;
            --bg-darker: #020a13;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, var(--primary-color) 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, var(--bg-dark) 0%, var(--bg-darker) 100%);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* ============================================
           UI OVERLAY
           ============================================ */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* ============================================
           MENU SYSTEM (Shared)
           ============================================ */
        .menu-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid rgba(124, 58, 237, 0.7);
            display: none;
            pointer-events: auto;
            backdrop-filter: blur(15px);
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
        }

        .menu-screen.active {
            display: block;
        }

        .menu-title {
            color: var(--primary-light);
            font-size: 28px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .menu-subtitle {
            color: #d1d5db;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
        }

        /* ============================================
           BUTTONS (Shared)
           ============================================ */
        .btn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.6);
        }

        .btn-secondary {
            background: rgba(239, 68, 68, 0.7);
        }

        .btn-secondary:hover {
            background: rgba(239, 68, 68, 0.9);
        }

        /* ============================================
           NOTIFICATIONS
           ============================================ */
        #gameNotification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(124, 58, 237, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(124, 58, 237, 0.8);
            pointer-events: none;
            z-index: 1000;
        }

        /* ============================================
           START SCREEN
           ============================================ */
        #startScreen {
            z-index: 200;
        }

        .start-title {
            font-size: 52px;
            color: var(--primary-light);
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.8);
        }

        .start-subtitle {
            font-size: 22px;
            color: #d1d5db;
            margin-bottom: 50px;
        }

        /* ============================================
           PHASE-SPECIFIC STYLES
           ============================================ */
        /* Cell Phase HUD */
        .cell-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            min-width: 280px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.5);
        }

        /* Creature Phase HUD */
        .creature-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            min-width: 250px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.5);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .stat-label {
            color: var(--primary-light);
            font-weight: bold;
        }

        .stat-value {
            color: #fff;
        }

        /* Loading/Transition */
        .transition-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 300;
            pointer-events: auto;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .transition-screen.active {
            display: flex;
        }

        .transition-text {
            color: var(--primary-light);
            font-size: 36px;
            text-align: center;
            margin: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="startScreen" class="menu-screen active">
            <h1 class="start-title">SPORE EVOLUTION</h1>
            <p class="start-subtitle">Version Refactorisée</p>
            <button class="btn" id="btnStartGame">COMMENCER</button>
        </div>

        <!-- Transition Screen -->
        <div id="transitionScreen" class="transition-screen">
            <canvas id="transitionCanvas" width="800" height="600"></canvas>
            <div class="transition-text">Évolution en cours...</div>
        </div>

        <!-- Game Notification -->
        <div id="gameNotification"></div>

        <!-- UI Overlay -->
        <div id="ui">
            <!-- Cell Phase HUD -->
            <div id="cellHUD" class="cell-hud hidden">
                <div class="stat-row">
                    <span class="stat-label">Niveau:</span>
                    <span class="stat-value" id="cellLevel">1</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Taille:</span>
                    <span class="stat-value" id="cellSize">15</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Score:</span>
                    <span class="stat-value" id="cellScore">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Progression:</span>
                    <span class="stat-value" id="cellProgress">0%</span>
                </div>
            </div>

            <!-- Creature Phase HUD -->
            <div id="creatureHUD" class="creature-hud hidden">
                <div class="stat-row">
                    <span class="stat-label">Santé:</span>
                    <span class="stat-value" id="creatureHealth">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">ADN:</span>
                    <span class="stat-value" id="creatureDNA">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Meute:</span>
                    <span class="stat-value" id="creaturePack">0/4</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Capacités:</span>
                    <span class="stat-value">1: Attaque | 2: Charme | 3: Appel</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        'use strict';

        // ============================================
        // CONSTANTS AND CONFIGURATION
        // ============================================
        const CONFIG = {
            WORLD: {
                CELL_SIZE: 4000,
                CREATURE_SIZE: 3000
            },
            LIMITS: {
                MAX_PARTICLES: 300,
                MAX_CELLS: 250,
                MAX_CREATURES: 50
            },
            GAMEPLAY: {
                CELL_TO_CREATURE_LEVEL: 10,
                MAX_PACK_SIZE: 4
            },
            PERFORMANCE: {
                TARGET_FPS: 60,
                PARTICLE_POOL_SIZE: 500
            }
        };

        // ============================================
        // UTILITY FUNCTIONS MODULE
        // ============================================
        const Utils = {
            /**
             * Clamp a value between min and max
             */
            clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            },

            /**
             * Calculate distance between two points
             */
            distance(x1, y1, x2, y2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                return Math.sqrt(dx * dx + dy * dy);
            },

            /**
             * Darken a hex color
             */
            darkenColor(color, factor) {
                if (!color.startsWith('#')) return color;
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
            },

            /**
             * Random number between min and max
             */
            random(min, max) {
                return Math.random() * (max - min) + min;
            },

            /**
             * Random integer between min and max (inclusive)
             */
            randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            },

            /**
             * Random element from array
             */
            randomChoice(array) {
                return array[Math.floor(Math.random() * array.length)];
            }
        };

        // ============================================
        // NOTIFICATION SYSTEM MODULE
        // ============================================
        class NotificationSystem {
            constructor(elementId) {
                this.element = document.getElementById(elementId);
                this.queue = [];
                this.isShowing = false;
            }

            show(message, duration = 2000) {
                this.queue.push({ message, duration });
                if (!this.isShowing) {
                    this.showNext();
                }
            }

            showNext() {
                if (this.queue.length === 0) {
                    this.isShowing = false;
                    return;
                }

                this.isShowing = true;
                const { message, duration } = this.queue.shift();

                this.element.textContent = message;
                this.element.style.display = 'block';

                setTimeout(() => {
                    this.element.style.display = 'none';
                    this.showNext();
                }, duration);
            }
        }

        // ============================================
        // INPUT MANAGER MODULE
        // ============================================
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouse = { x: 0, y: 0, down: false };
                this.setupListeners();
            }

            setupListeners() {
                // Keyboard
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // Mouse
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                window.addEventListener('mousedown', () => {
                    this.mouse.down = true;
                });

                window.addEventListener('mouseup', () => {
                    this.mouse.down = false;
                });
            }

            isKeyPressed(key) {
                return this.keys[key] || false;
            }

            isMoving() {
                return this.isKeyPressed('w') || this.isKeyPressed('W') || this.isKeyPressed('z') || this.isKeyPressed('Z') ||
                       this.isKeyPressed('a') || this.isKeyPressed('A') || this.isKeyPressed('q') || this.isKeyPressed('Q') ||
                       this.isKeyPressed('s') || this.isKeyPressed('S') ||
                       this.isKeyPressed('d') || this.isKeyPressed('D') ||
                       this.isKeyPressed('ArrowUp') || this.isKeyPressed('ArrowDown') ||
                       this.isKeyPressed('ArrowLeft') || this.isKeyPressed('ArrowRight');
            }

            getMovementDirection() {
                let dx = 0;
                let dy = 0;

                if (this.isKeyPressed('ArrowUp') || this.isKeyPressed('w') || this.isKeyPressed('W') || this.isKeyPressed('z') || this.isKeyPressed('Z')) dy -= 1;
                if (this.isKeyPressed('ArrowDown') || this.isKeyPressed('s') || this.isKeyPressed('S')) dy += 1;
                if (this.isKeyPressed('ArrowLeft') || this.isKeyPressed('a') || this.isKeyPressed('A') || this.isKeyPressed('q') || this.isKeyPressed('Q')) dx -= 1;
                if (this.isKeyPressed('ArrowRight') || this.isKeyPressed('d') || this.isKeyPressed('D')) dx += 1;

                return { dx, dy };
            }
        }

        // ============================================
        // UI MANAGER MODULE
        // ============================================
        class UIManager {
            constructor() {
                this.cellHUD = document.getElementById('cellHUD');
                this.creatureHUD = document.getElementById('creatureHUD');
            }

            showCellHUD() {
                if (this.cellHUD) this.cellHUD.classList.remove('hidden');
                if (this.creatureHUD) this.creatureHUD.classList.add('hidden');
            }

            showCreatureHUD() {
                if (this.cellHUD) this.cellHUD.classList.add('hidden');
                if (this.creatureHUD) this.creatureHUD.classList.remove('hidden');
            }

            hideAll() {
                if (this.cellHUD) this.cellHUD.classList.add('hidden');
                if (this.creatureHUD) this.creatureHUD.classList.add('hidden');
            }

            updateCellStats(player) {
                if (!player) return;

                const levelEl = document.getElementById('cellLevel');
                const sizeEl = document.getElementById('cellSize');
                const scoreEl = document.getElementById('cellScore');
                const progressEl = document.getElementById('cellProgress');

                if (levelEl) levelEl.textContent = player.level;
                if (sizeEl) sizeEl.textContent = Math.floor(player.size);
                if (scoreEl) scoreEl.textContent = player.score;
                if (progressEl) {
                    const requiredProgress = player.level * 100;
                    const percentage = Math.floor((player.progress / requiredProgress) * 100);
                    progressEl.textContent = `${percentage}%`;
                }
            }

            updateCreatureStats(player, packSize) {
                if (!player) return;

                const healthEl = document.getElementById('creatureHealth');
                const dnaEl = document.getElementById('creatureDNA');
                const packEl = document.getElementById('creaturePack');

                if (healthEl) healthEl.textContent = `${Math.floor(player.health)}/${player.maxHealth}`;
                if (dnaEl) dnaEl.textContent = player.dna;
                if (packEl) packEl.textContent = `${packSize}/${CONFIG.GAMEPLAY.MAX_PACK_SIZE}`;
            }
        }

        // ============================================
        // CAMERA SYSTEM MODULE
        // ============================================
        class Camera {
            constructor() {
                this.x = 0;
                this.y = 0;
                this.smoothness = 0.1;
            }

            follow(target, canvasWidth, canvasHeight) {
                const targetX = target.x - canvasWidth / 2;
                const targetY = target.y - canvasHeight / 2;

                this.x += (targetX - this.x) * this.smoothness;
                this.y += (targetY - this.y) * this.smoothness;
            }

            toScreenX(worldX) {
                return worldX - this.x;
            }

            toScreenY(worldY) {
                return worldY - this.y;
            }

            toWorldX(screenX) {
                return screenX + this.x;
            }

            toWorldY(screenY) {
                return screenY + this.y;
            }
        }

        // ============================================
        // PARTICLE SYSTEM MODULE (with Object Pooling)
        // ============================================
        class Particle {
            constructor() {
                this.reset();
            }

            reset(x = 0, y = 0, color = '#fff', size = 2, vx = 0, vy = 0, life = 1.0, decay = 0.02) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.decay = decay;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.98;
                this.vy *= 0.98;

                if (this.life <= 0) {
                    this.active = false;
                }
            }

            draw(ctx, camera) {
                if (!this.active) return;

                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(
                    camera.toScreenX(this.x),
                    camera.toScreenY(this.y),
                    this.size * this.life,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.restore();
            }
        }

        class ParticleSystem {
            constructor(maxParticles = CONFIG.PERFORMANCE.PARTICLE_POOL_SIZE) {
                this.pool = [];
                this.activeParticles = [];

                // Pre-allocate particle pool
                for (let i = 0; i < maxParticles; i++) {
                    this.pool.push(new Particle());
                }
            }

            emit(x, y, color, size, vx, vy, life = 1.0, decay = 0.02) {
                // Get particle from pool
                let particle = this.pool.pop();
                if (!particle) {
                    // Pool exhausted, reuse oldest active particle
                    particle = this.activeParticles.shift();
                    if (!particle) return; // Shouldn't happen but safety check
                }

                particle.reset(x, y, color, size, vx, vy, life, decay);
                this.activeParticles.push(particle);
            }

            update() {
                for (let i = this.activeParticles.length - 1; i >= 0; i--) {
                    const particle = this.activeParticles[i];
                    particle.update();

                    if (!particle.active) {
                        // Return to pool
                        this.activeParticles.splice(i, 1);
                        this.pool.push(particle);
                    }
                }
            }

            draw(ctx, camera) {
                this.activeParticles.forEach(particle => particle.draw(ctx, camera));
            }

            clear() {
                // Return all active particles to pool
                this.pool.push(...this.activeParticles);
                this.activeParticles = [];
            }
        }

        // ============================================
        // CELL PHASE MODULE
        // ============================================

        /**
         * Base Cell class - represents any cell entity in the game
         */
        class Cell {
            constructor(x, y, size, color, type = 'neutral') {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.type = type;
                this.vx = 0;
                this.vy = 0;
                this.speed = this.calculateSpeed();
                this.targetX = x;
                this.targetY = y;
                this.hasSpikes = Math.random() < 0.3;
                this.isElectric = Math.random() < 0.15;
                this.isPoisonous = Math.random() < 0.15;
                this.health = size * 2;
                this.maxHealth = this.health;
            }

            calculateSpeed() {
                const baseSpeed = {
                    'food': 0,
                    'plant': 0,
                    'predator': 1.5,
                    'prey': 2.5
                };
                return baseSpeed[this.type] || 1;
            }

            update(worldSize, currents, player) {
                if (this.type !== 'player' && this.type !== 'food' && this.type !== 'plant') {
                    this.updateAI(player);
                }

                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;

                this.x = Utils.clamp(this.x, this.size, worldSize - this.size);
                this.y = Utils.clamp(this.y, this.size, worldSize - this.size);

                this.applyCurrents(currents);
            }

            applyCurrents(currents) {
                currents.forEach(current => {
                    const dist = Utils.distance(this.x, this.y, current.x, current.y);
                    if (dist < current.radius) {
                        const force = (1 - dist / current.radius) * current.strength;
                        this.vx += Math.cos(current.angle) * force;
                        this.vy += Math.sin(current.angle) * force;
                    }
                });
            }

            updateAI(player) {
                if (!player) return;

                const dist = Utils.distance(this.x, this.y, player.x, player.y);

                if (dist < 400) {
                    if (this.type === 'predator' && player.size < this.size * 0.9) {
                        const angle = Math.atan2(player.y - this.y, player.x - this.x);
                        this.vx += Math.cos(angle) * this.speed * 0.12;
                        this.vy += Math.sin(angle) * this.speed * 0.12;
                    } else if (this.type === 'prey' || player.size > this.size * 1.1) {
                        const angle = Math.atan2(player.y - this.y, player.x - this.x);
                        this.vx -= Math.cos(angle) * this.speed * 0.15;
                        this.vy -= Math.sin(angle) * this.speed * 0.15;
                    }
                } else {
                    if (Math.random() < 0.015) {
                        this.targetX = Utils.random(0, CONFIG.WORLD.CELL_SIZE);
                        this.targetY = Utils.random(0, CONFIG.WORLD.CELL_SIZE);
                    }
                    const tdist = Utils.distance(this.x, this.y, this.targetX, this.targetY);
                    if (tdist > 10) {
                        this.vx += ((this.targetX - this.x) / tdist) * 0.05;
                        this.vy += ((this.targetY - this.y) / tdist) * 0.05;
                    }
                }

                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.speed * 2.5;
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }
            }

            draw(ctx, camera) {
                const screenX = camera.toScreenX(this.x);
                const screenY = camera.toScreenY(this.y);

                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, this.size);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.7, this.color);
                gradient.addColorStop(1, Utils.darkenColor(this.color, 0.5));

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.size, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasSpikes) this.drawSpikes(ctx, screenX, screenY);
                if (this.isElectric) this.drawElectric(ctx, screenX, screenY);
                if (this.isPoisonous) this.drawPoison(ctx, screenX, screenY);

                if (this.type === 'player' || this.type === 'predator' || this.type === 'prey') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.beginPath();
                    ctx.arc(screenX - this.size * 0.2, screenY - this.size * 0.2, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            drawSpikes(ctx, screenX, screenY) {
                const spikeCount = 8;
                ctx.fillStyle = 'rgba(200, 200, 200, 0.8)';
                for (let i = 0; i < spikeCount; i++) {
                    const angle = (Math.PI * 2 / spikeCount) * i;
                    ctx.beginPath();
                    ctx.moveTo(screenX + Math.cos(angle) * this.size, screenY + Math.sin(angle) * this.size);
                    ctx.lineTo(screenX + Math.cos(angle) * (this.size * 1.4), screenY + Math.sin(angle) * (this.size * 1.4));
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#888';
                    ctx.stroke();
                }
            }

            drawElectric(ctx, screenX, screenY) {
                const time = Date.now() * 0.005;
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.6 + Math.sin(time) * 0.4;
                for (let i = 0; i < 3; i++) {
                    const angle = time + i * (Math.PI * 2 / 3);
                    const x = screenX + Math.cos(angle) * this.size * 0.8;
                    const y = screenY + Math.sin(angle) * this.size * 0.8;
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            drawPoison(ctx, screenX, screenY) {
                ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI * 2 / 4) * i + Date.now() * 0.002;
                    const x = screenX + Math.cos(angle) * this.size * 0.7;
                    const y = screenY + Math.sin(angle) * this.size * 0.7;
                    ctx.beginPath();
                    ctx.arc(x, y, this.size * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            distanceTo(other) {
                return Utils.distance(this.x, this.y, other.x, other.y);
            }

            collidesWith(other) {
                return this.distanceTo(other) < (this.size + other.size);
            }
        }

        /**
         * Player Cell class - extends Cell with player-specific features
         */
        class PlayerCell extends Cell {
            constructor(x, y, config) {
                super(x, y, 15, config.color, 'player');
                this.diet = config.diet;
                this.score = 0;
                this.level = 1;
                this.progress = 0;
                this.evolutionPoints = 0;
                this.baseSpeed = this.getDietSpeed();
                this.attackPower = this.getDietAttack();
                this.hasSpikes = config.defense === 'spikes';
                this.isElectric = config.defense === 'electric';
                this.isPoisonous = config.defense === 'poison';
                this.isCamouflaged = false;
                this.statusEffects = [];
                this.mateCallCooldown = 0;
                this.reproductionReady = false;
            }

            getDietSpeed() {
                const speeds = { herbivore: 3.2, carnivore: 2.1, omnivore: 2.7 };
                return speeds[this.diet] || 2.5;
            }

            getDietAttack() {
                const attacks = { herbivore: 0.6, carnivore: 1.4, omnivore: 1.0 };
                return attacks[this.diet] || 1.0;
            }

            get effectiveSpeed() {
                let speed = this.baseSpeed;
                if (this.statusEffects.includes('paralyzed')) speed *= 0.3;
                if (this.isCamouflaged) speed *= 0.7;
                return speed;
            }

            moveTo(targetX, targetY) {
                const dist = Utils.distance(this.x, this.y, targetX, targetY);
                if (dist > 5) {
                    const speed = this.effectiveSpeed;
                    this.vx += ((targetX - this.x) / dist) * speed * 0.15;
                    this.vy += ((targetY - this.y) / dist) * speed * 0.15;
                }

                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.effectiveSpeed * 3;
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }
            }

            canEat(cell) {
                if (this.diet === 'herbivore') {
                    return cell.type === 'food' || cell.type === 'plant';
                } else if (this.diet === 'carnivore') {
                    return cell.type === 'prey' || cell.type === 'predator';
                } else {
                    return true;
                }
            }

            eat(cell, particleSystem, onLevelUp, onUpdate) {
                if (!this.canEat(cell)) return false;

                const growthAmount = cell.size * 0.25;
                this.size += growthAmount;
                this.score += Math.floor(cell.size * 10 * this.attackPower);
                this.progress += cell.size;

                // Emit particles
                for (let i = 0; i < 12; i++) {
                    const angle = Utils.random(0, Math.PI * 2);
                    const speed = Utils.random(2, 5);
                    particleSystem.emit(
                        cell.x, cell.y, cell.color, Utils.random(2, 5),
                        Math.cos(angle) * speed, Math.sin(angle) * speed, 1.0, 0.02
                    );
                }

                const requiredProgress = this.level * 100;
                if (this.progress >= requiredProgress) {
                    this.levelUp(onLevelUp);
                }

                if (this.level >= 3 && !this.reproductionReady) {
                    this.reproductionReady = true;
                }

                if (onUpdate) onUpdate();
                return true;
            }

            levelUp(callback) {
                this.level++;
                this.progress = 0;
                this.evolutionPoints++;

                if (callback) {
                    callback(this.level);
                }
            }

            takeDamage(amount, type = 'normal') {
                if (this.hasSpikes && type === 'contact') {
                    return false;
                }

                this.health -= amount;
                if (this.health <= 0) {
                    return true;
                }
                return false;
            }

            addStatusEffect(effect, duration) {
                if (!this.statusEffects.includes(effect)) {
                    this.statusEffects.push(effect);
                    setTimeout(() => {
                        this.statusEffects = this.statusEffects.filter(e => e !== effect);
                    }, duration);
                }
            }
        }

        /**
         * Cell Phase - manages the cellular stage gameplay
         */
        class CellPhase {
            constructor(gameManager) {
                this.gm = gameManager;
                this.player = null;
                this.cells = [];
                this.plants = [];
                this.currents = [];
                this.thermalVents = [];
                this.playerConfig = null;
            }

            init(playerConfig) {
                this.playerConfig = playerConfig;
                this.player = new PlayerCell(
                    CONFIG.WORLD.CELL_SIZE / 2,
                    CONFIG.WORLD.CELL_SIZE / 2,
                    playerConfig
                );

                this.cells = [];
                this.plants = [];

                // Create plants
                for (let i = 0; i < 80; i++) {
                    this.plants.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(4, 10),
                        '#10b981',
                        'plant'
                    ));
                }

                // Create food
                for (let i = 0; i < 100; i++) {
                    this.cells.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(3, 8),
                        Utils.randomChoice(['#fbbf24', '#f97316', '#a855f7', '#ec4899', '#22d3ee']),
                        'food'
                    ));
                }

                // Create prey
                for (let i = 0; i < 25; i++) {
                    this.cells.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(8, 18),
                        '#4ade80',
                        'prey'
                    ));
                }

                // Create predators
                for (let i = 0; i < 10; i++) {
                    this.cells.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(20, 35),
                        '#ef4444',
                        'predator'
                    ));
                }

                this.createCurrents();
                this.createThermalVents();
            }

            createCurrents() {
                this.currents = [];
                for (let i = 0; i < 5; i++) {
                    this.currents.push({
                        x: Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        y: Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        radius: Utils.random(200, 500),
                        angle: Utils.random(0, Math.PI * 2),
                        strength: Utils.random(0.3, 0.7)
                    });
                }
            }

            createThermalVents() {
                this.thermalVents = [];
                for (let i = 0; i < 8; i++) {
                    this.thermalVents.push({
                        x: Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        y: Utils.random(2500, 4000),
                        radius: 100,
                        strength: 2
                    });
                }
            }

            update(deltaTime) {
                if (!this.player) return;

                // Update player movement from input
                const dir = this.gm.input.getMovementDirection();
                if (dir.dx !== 0 || dir.dy !== 0) {
                    this.player.moveTo(
                        this.player.x + dir.dx * 100,
                        this.player.y + dir.dy * 100
                    );
                }

                this.player.update(CONFIG.WORLD.CELL_SIZE, this.currents, null);

                if (this.player.mateCallCooldown > 0) {
                    this.player.mateCallCooldown--;
                }

                // Update cells
                this.cells.forEach(cell => cell.update(CONFIG.WORLD.CELL_SIZE, this.currents, this.player));
                this.plants.forEach(plant => plant.update(CONFIG.WORLD.CELL_SIZE, this.currents, this.player));

                // Handle collisions
                const allEntities = [...this.cells, ...this.plants];
                for (let i = allEntities.length - 1; i >= 0; i--) {
                    const cell = allEntities[i];
                    if (this.player.collidesWith(cell)) {
                        if (cell.size < this.player.size * 0.8 || cell.type === 'food' || cell.type === 'plant') {
                            if (this.player.eat(cell, this.gm.particles, (level) => {
                                this.gm.notifications.show(`NIVEAU ${level}!`);
                                if (level >= CONFIG.GAMEPLAY.CELL_TO_CREATURE_LEVEL) {
                                    setTimeout(() => this.transitionToCreature(), 1000);
                                }
                            })) {
                                if (cell.type === 'plant') {
                                    this.plants = this.plants.filter(p => p !== cell);
                                } else {
                                    this.cells = this.cells.filter(c => c !== cell);
                                }
                            }
                        } else if (cell.size > this.player.size * 1.2) {
                            if (cell.hasSpikes && !this.player.hasSpikes) {
                                this.player.takeDamage(5, 'spikes');
                                this.gm.notifications.show('Aïe! Piquants!');
                            }
                            if (cell.isElectric) {
                                this.player.addStatusEffect('paralyzed', 2000);
                                this.gm.notifications.show('Paralysé!');
                            }
                            if (!this.player.hasSpikes) {
                                if (this.player.takeDamage(10, 'contact')) {
                                    this.gm.notifications.show('GAME OVER!');
                                }
                            }
                        }
                    }
                }

                // Spawn entities
                if (Math.random() < 0.015 && this.cells.filter(c => c.type === 'food').length < 120) {
                    this.cells.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(3, 8),
                        Utils.randomChoice(['#fbbf24', '#f97316', '#a855f7', '#ec4899', '#22d3ee']),
                        'food'
                    ));
                }

                if (Math.random() < 0.01 && this.plants.length < 100) {
                    this.plants.push(new Cell(
                        Utils.random(0, CONFIG.WORLD.CELL_SIZE),
                        Utils.random(0, 1500),
                        Utils.random(4, 10),
                        '#10b981',
                        'plant'
                    ));
                }

                // Limit entities
                if (this.cells.length > CONFIG.LIMITS.MAX_CELLS) {
                    this.cells.splice(0, this.cells.length - CONFIG.LIMITS.MAX_CELLS);
                }

                // Camera follow player
                this.gm.camera.follow(this.player, this.gm.canvas.width, this.gm.canvas.height);

                // Update UI
                this.gm.ui.updateCellStats(this.player);
            }

            render(ctx, camera) {
                // Draw environment
                ctx.fillStyle = '#0a1929';
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

                // Draw entities
                this.plants.forEach(plant => plant.draw(ctx, camera));
                this.cells.forEach(cell => cell.draw(ctx, camera));
                if (this.player) {
                    this.player.draw(ctx, camera);
                }
            }

            transitionToCreature() {
                this.gm.notifications.show('Transition vers Phase Créature...');
                setTimeout(() => {
                    this.gm.startCreaturePhase(this.playerConfig);
                }, 2000);
            }
        }

        // ============================================
        // CREATURE PHASE MODULE
        // ============================================

        /**
         * Creature class - represents any creature entity in the game
         */
        class Creature {
            constructor(x, y, config, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.config = config;
                this.isPlayer = isPlayer;
                this.vx = 0;
                this.vy = 0;
                this.size = 30;
                this.health = 100;
                this.maxHealth = 100;
                this.speed = this.calculateSpeed();
                this.attack = this.calculateAttack();
                this.charm = this.calculateCharm();
                this.dna = 0;
                this.angle = 0;
                this.animFrame = 0;
                this.abilities = {
                    attack: { cooldown: 0, maxCooldown: 60 },
                    charm: { cooldown: 0, maxCooldown: 120 },
                    call: { cooldown: 0, maxCooldown: 180 }
                };
                this.targetX = x;
                this.targetY = y;
            }

            calculateSpeed() {
                const legSpeed = { 2: 2, 4: 3, 6: 2.5 };
                return legSpeed[this.config.legs] || 2;
            }

            calculateAttack() {
                const baseAttack = { 0: 5, 2: 15, 4: 25 };
                const headBonus = { carnivore: 10, omnivore: 5, herbivore: 0 };
                return (baseAttack[this.config.arms] || 10) + (headBonus[this.config.head] || 5);
            }

            calculateCharm() {
                const armCharm = { 0: 10, 2: 20, 4: 30 };
                return armCharm[this.config.arms] || 15;
            }

            update(worldSize, player) {
                // Movement
                this.x += this.vx;
                this.y += this.vy;

                // Friction
                this.vx *= 0.92;
                this.vy *= 0.92;

                // Boundaries
                this.x = Utils.clamp(this.x, 50, worldSize - 50);
                this.y = Utils.clamp(this.y, 50, worldSize - 50);

                // Angle based on direction
                if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
                    this.angle = Math.atan2(this.vy, this.vx);
                    this.animFrame += 0.2;
                }

                // Cooldowns
                Object.keys(this.abilities).forEach(key => {
                    if (this.abilities[key].cooldown > 0) {
                        this.abilities[key].cooldown--;
                    }
                });

                // AI behavior
                if (!this.isPlayer) {
                    this.updateAI(player, worldSize);
                }
            }

            updateAI(player, worldSize) {
                if (!player) return;

                const dist = Utils.distance(this.x, this.y, player.x, player.y);

                if (dist < 300) {
                    // Aggressive creatures chase player
                    if (this.config.head === 'carnivore' && Math.random() < 0.02) {
                        this.moveTo(player.x, player.y);
                    }
                    // Passive creatures flee
                    else if (this.config.head === 'herbivore' && dist < 150) {
                        const fleeAngle = Math.atan2(this.y - player.y, this.x - player.x);
                        this.vx += Math.cos(fleeAngle) * 0.5;
                        this.vy += Math.sin(fleeAngle) * 0.5;
                    }
                } else {
                    // Random wandering
                    if (Math.random() < 0.01) {
                        this.targetX = Utils.random(0, worldSize);
                        this.targetY = Utils.random(0, worldSize);
                    }

                    const tdist = Utils.distance(this.x, this.y, this.targetX, this.targetY);
                    if (tdist > 20) {
                        this.moveTo(this.targetX, this.targetY);
                    }
                }
            }

            moveTo(targetX, targetY) {
                const dist = Utils.distance(this.x, this.y, targetX, targetY);
                if (dist > 5) {
                    this.vx += ((targetX - this.x) / dist) * this.speed * 0.3;
                    this.vy += ((targetY - this.y) / dist) * this.speed * 0.3;
                }

                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = this.speed * 2;
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }
            }

            draw(ctx, camera) {
                const screenX = camera.toScreenX(this.x);
                const screenY = camera.toScreenY(this.y);

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(this.angle);

                // Body size
                const bodySize = { small: 20, medium: 30, large: 40, petit: 20, moyen: 30, grand: 40 };
                const size = bodySize[this.config.body] || 30;

                // Body
                ctx.fillStyle = this.config.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.fillStyle = this.config.color;
                ctx.beginPath();
                const headSize = size * 0.6;
                ctx.arc(size * 0.8, 0, headSize, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                const eyeSize = { small: 3, medium: 5, large: 7, petit: 3, moyen: 5, grand: 7 };
                const eSize = eyeSize[this.config.eyes] || 5;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(size * 0.9, -headSize * 0.3, eSize, 0, Math.PI * 2);
                ctx.arc(size * 0.9, headSize * 0.3, eSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(size * 0.95, -headSize * 0.3, eSize * 0.5, 0, Math.PI * 2);
                ctx.arc(size * 0.95, headSize * 0.3, eSize * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // Legs (animated)
                ctx.strokeStyle = this.config.color;
                ctx.lineWidth = 4;
                const legCount = this.config.legs;
                const legSpacing = (size * 1.5) / legCount;
                for (let i = 0; i < legCount; i++) {
                    const legY = -size * 0.5 + i * legSpacing;
                    const legOffset = Math.sin(this.animFrame + i) * 5;
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.5, legY);
                    ctx.lineTo(-size * 0.8 + legOffset, legY + 10);
                    ctx.stroke();
                }

                // Arms
                if (this.config.arms > 0) {
                    for (let i = 0; i < this.config.arms; i++) {
                        const armY = (i % 2 === 0 ? -1 : 1) * size * 0.3;
                        const armOffset = Math.sin(this.animFrame + i * 2) * 3;
                        ctx.beginPath();
                        ctx.moveTo(0, armY);
                        ctx.lineTo(armOffset, armY + (i % 2 === 0 ? -15 : 15));
                        ctx.stroke();
                    }
                }

                // Player indicator
                if (this.isPlayer) {
                    ctx.strokeStyle = '#00d9ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();

                // Health bar (for non-player creatures)
                if (!this.isPlayer && this.health < this.maxHealth) {
                    const barWidth = 40;
                    const barHeight = 4;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(screenX - barWidth/2, screenY - 40, barWidth, barHeight);
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(screenX - barWidth/2, screenY - 40, barWidth * (this.health/this.maxHealth), barHeight);
                }
            }

            distanceTo(other) {
                return Utils.distance(this.x, this.y, other.x, other.y);
            }

            collidesWith(other) {
                return this.distanceTo(other) < (this.size + other.size);
            }

            performAttack(target, particleSystem) {
                if (this.abilities.attack.cooldown > 0) return false;
                target.health -= this.attack;
                this.abilities.attack.cooldown = this.abilities.attack.maxCooldown;

                // Attack effect particles
                for (let i = 0; i < 10; i++) {
                    const t = i / 10;
                    const px = this.x + (target.x - this.x) * t;
                    const py = this.y + (target.y - this.y) * t;
                    particleSystem.emit(px, py, '#ef4444', 5, 0, 0, 0.5, 0.02);
                }

                if (target.health <= 0) {
                    this.dna += 10;
                    return true;
                }
                return false;
            }

            performCharm(target, particleSystem) {
                if (this.abilities.charm.cooldown > 0) return false;
                this.abilities.charm.cooldown = this.abilities.charm.maxCooldown;

                // Charm effect particles
                for (let i = 0; i < 15; i++) {
                    const angle = Utils.random(0, Math.PI * 2);
                    particleSystem.emit(
                        this.x, this.y, '#ec4899', 4,
                        Math.cos(angle) * 2, Math.sin(angle) * 2, 2.0, 0.02
                    );
                }
                return true;
            }

            performCall(creatures, particleSystem) {
                if (this.abilities.call.cooldown > 0) return false;
                this.abilities.call.cooldown = this.abilities.call.maxCooldown;

                // Call effect particles
                for (let i = 0; i < 20; i++) {
                    const angle = (Math.PI * 2 / 20) * i;
                    particleSystem.emit(
                        this.x, this.y, '#facc15', 3,
                        Math.cos(angle) * 4, Math.sin(angle) * 4, 2.0, 0.02
                    );
                }

                // Attract nearby creatures
                creatures.forEach(c => {
                    if (!c.isPlayer && c.distanceTo(this) < 200) {
                        c.vx += (this.x - c.x) * 0.01;
                        c.vy += (this.y - c.y) * 0.01;
                    }
                });
                return true;
            }
        }

        /**
         * Creature Phase - manages the creature stage gameplay
         */
        class CreaturePhase {
            constructor(gameManager) {
                this.gm = gameManager;
                this.player = null;
                this.creatures = [];
                this.pack = [];
                this.creatureConfig = null;
            }

            init(baseConfig) {
                // Convert cell config to creature config
                this.creatureConfig = {
                    body: 'medium',
                    legs: 2,
                    arms: 2,
                    head: 'omnivore',
                    eyes: 'medium',
                    color: baseConfig.color || '#00d9ff'
                };

                this.player = new Creature(
                    CONFIG.WORLD.CREATURE_SIZE / 2,
                    CONFIG.WORLD.CREATURE_SIZE / 2,
                    this.creatureConfig,
                    true
                );

                this.creatures = [];
                this.pack = [];

                // Generate random creatures
                for (let i = 0; i < 30; i++) {
                    const config = {
                        body: Utils.randomChoice(['small', 'medium', 'large']),
                        legs: Utils.randomChoice([2, 4, 6]),
                        arms: Utils.randomChoice([0, 2, 4]),
                        head: Utils.randomChoice(['carnivore', 'herbivore', 'omnivore']),
                        eyes: Utils.randomChoice(['small', 'medium', 'large']),
                        color: Utils.randomChoice(['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dfe6e9'])
                    };

                    this.creatures.push(new Creature(
                        Utils.random(0, CONFIG.WORLD.CREATURE_SIZE),
                        Utils.random(0, CONFIG.WORLD.CREATURE_SIZE),
                        config,
                        false
                    ));
                }
            }

            update(deltaTime) {
                if (!this.player) return;

                // Update player movement from input
                const dir = this.gm.input.getMovementDirection();
                if (dir.dx !== 0 || dir.dy !== 0) {
                    this.player.moveTo(
                        this.player.x + dir.dx * 100,
                        this.player.y + dir.dy * 100
                    );
                }

                // Handle abilities
                if (this.gm.input.isKeyPressed('1')) {
                    this.useAbility('attack');
                }
                if (this.gm.input.isKeyPressed('2')) {
                    this.useAbility('charm');
                }
                if (this.gm.input.isKeyPressed('3')) {
                    this.useAbility('call');
                }

                // Update player
                this.player.update(CONFIG.WORLD.CREATURE_SIZE, null);

                // Update creatures
                this.creatures.forEach(creature => {
                    creature.update(CONFIG.WORLD.CREATURE_SIZE, this.player);
                });

                // Update pack members
                this.pack.forEach(member => {
                    // Follow player
                    const dist = member.distanceTo(this.player);
                    if (dist > 100) {
                        member.moveTo(this.player.x, this.player.y);
                    }
                });

                // Handle collisions
                for (let i = this.creatures.length - 1; i >= 0; i--) {
                    const creature = this.creatures[i];
                    if (this.player.collidesWith(creature)) {
                        // Simple interaction
                        if (creature.health > 0) {
                            // Could add more collision logic here
                        }
                    }
                }

                // Limit creatures
                if (this.creatures.length > CONFIG.LIMITS.MAX_CREATURES) {
                    this.creatures.splice(0, this.creatures.length - CONFIG.LIMITS.MAX_CREATURES);
                }

                // Camera follow player
                this.gm.camera.follow(this.player, this.gm.canvas.width, this.gm.canvas.height);

                // Update UI
                this.gm.ui.updateCreatureStats(this.player, this.pack.length);
            }

            useAbility(abilityType) {
                if (!this.player) return;

                if (abilityType === 'attack') {
                    // Find nearest creature and attack
                    let nearest = null;
                    let nearestDist = 100; // Attack range
                    this.creatures.forEach(c => {
                        const dist = this.player.distanceTo(c);
                        if (dist < nearestDist) {
                            nearest = c;
                            nearestDist = dist;
                        }
                    });

                    if (nearest) {
                        if (this.player.performAttack(nearest, this.gm.particles)) {
                            this.gm.notifications.show('Attaque réussie!');
                            this.creatures = this.creatures.filter(c => c !== nearest);
                        }
                    }
                } else if (abilityType === 'charm') {
                    // Find nearest creature and try to charm
                    let nearest = null;
                    let nearestDist = 100;
                    this.creatures.forEach(c => {
                        const dist = this.player.distanceTo(c);
                        if (dist < nearestDist) {
                            nearest = c;
                            nearestDist = dist;
                        }
                    });

                    if (nearest && this.pack.length < CONFIG.GAMEPLAY.MAX_PACK_SIZE) {
                        if (this.player.performCharm(nearest, this.gm.particles)) {
                            this.pack.push(nearest);
                            this.creatures = this.creatures.filter(c => c !== nearest);
                            nearest.isPlayer = false; // Mark as pack member
                            this.gm.notifications.show('Nouveau membre de la meute!');
                        }
                    }
                } else if (abilityType === 'call') {
                    if (this.player.performCall(this.creatures, this.gm.particles)) {
                        this.gm.notifications.show('Appel émis!');
                    }
                }
            }

            render(ctx, camera) {
                // Draw environment
                ctx.fillStyle = '#1a2a1a';
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

                // Draw simple ground
                ctx.fillStyle = '#2d4a2d';
                for (let i = 0; i < 5; i++) {
                    ctx.fillRect(0, ctx.canvas.height * 0.8 + i * 10, ctx.canvas.width, 10);
                }

                // Draw creatures
                this.creatures.forEach(creature => creature.draw(ctx, camera));
                this.pack.forEach(member => member.draw(ctx, camera));

                if (this.player) {
                    this.player.draw(ctx, camera);
                }
            }
        }

        // ============================================
        // GAME MANAGER - Main Game Controller
        // ============================================
        class GameManager {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                // Resize canvas
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Core systems
                this.camera = new Camera();
                this.input = new InputManager();
                this.particles = new ParticleSystem();
                this.notifications = new NotificationSystem('gameNotification');
                this.ui = new UIManager();

                // Game state
                this.currentPhase = null;
                this.isPaused = false;
                this.animationId = null;
                this.playerConfig = null;

                // Setup
                this.setupUI();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupUI() {
                const btnStart = document.getElementById('btnStartGame');
                if (btnStart) {
                    btnStart.addEventListener('click', () => this.showDietSelection());
                }
            }

            showDietSelection() {
                // For now, start directly with omnivore diet
                this.playerConfig = {
                    diet: 'omnivore',
                    color: '#00d9ff',
                    eyes: 'simple',
                    defense: 'none',
                    movement: 'flagellum',
                    spikes: 0,
                    electric: false,
                    poison: false
                };

                this.startGame();
            }

            startGame() {
                // Hide start screen
                const startScreen = document.getElementById('startScreen');
                if (startScreen) {
                    startScreen.classList.remove('active');
                }

                // Start with cell phase
                this.startCellPhase(this.playerConfig);
            }

            startCellPhase(config) {
                console.log('Starting Cell Phase...');
                this.notifications.show('Phase Cellulaire - Commencée!');

                // Clean up previous phase
                if (this.currentPhase) {
                    this.currentPhase = null;
                }
                this.particles.clear();

                // Initialize cell phase
                this.currentPhase = new CellPhase(this);
                this.currentPhase.init(config);

                // Show cell HUD
                this.ui.showCellHUD();
            }

            startCreaturePhase(config) {
                console.log('Starting Creature Phase...');
                this.notifications.show('Phase Créature - Commencée!');

                // Clean up previous phase
                if (this.currentPhase) {
                    this.currentPhase = null;
                }
                this.particles.clear();

                // Initialize creature phase
                this.currentPhase = new CreaturePhase(this);
                this.currentPhase.init(config);

                // Show creature HUD
                this.ui.showCreatureHUD();
            }

            update(deltaTime) {
                if (this.isPaused) return;

                // Update current phase
                if (this.currentPhase) {
                    this.currentPhase.update(deltaTime);
                }

                // Update particles
                this.particles.update();
            }

            render() {
                // Clear screen
                this.ctx.fillStyle = 'rgba(2, 10, 19, 0.3)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Render current phase
                if (this.currentPhase) {
                    this.currentPhase.render(this.ctx, this.camera);
                }

                // Render particles
                this.particles.draw(this.ctx, this.camera);
            }

            gameLoop(timestamp) {
                const deltaTime = timestamp - (this.lastTime || timestamp);
                this.lastTime = timestamp;

                this.update(deltaTime);
                this.render();

                this.animationId = requestAnimationFrame((ts) => this.gameLoop(ts));
            }

            start() {
                if (this.animationId) return;
                this.lastTime = performance.now();
                this.gameLoop(this.lastTime);
            }

            stop() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        const game = new GameManager();
        game.start();

        // Make game accessible globally for debugging
        window.game = game;

        console.log('%c🎮 Spore Evolution - Refactored Version Loaded', 'color: #7c3aed; font-size: 16px; font-weight: bold;');
        console.log('%cGame Manager initialized and ready!', 'color: #4ade80;');
    </script>
